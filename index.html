<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OH-Master Studio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>OH-Master</h2>
    <p>Studio</p>

    <ul>
      <li>🏠 Dashboard</li>
      <li>🏭 Factory Setup</li>
      <li>📘 Methods</li>
      <li>📊 Reports</li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main">

    <div class="topbar">
      <h1>OH-Master Studio</h1>
      <button>Start Simulation</button>
    </div>

    <!-- KPI Cards -->
    <div class="cards">

      <div class="card">
        <h3>Departments</h3>
        <h2>8</h2>
      </div>

      <div class="card">
        <h3>Methods</h3>
        <h2>5</h2>
      </div>

      <div class="card">
        <h3>Reports</h3>
        <h2>PDF</h2>
      </div>

      <div class="card">
        <h3>Simulator</h3>
        <h2>Ready</h2>
      </div>

    </div>

    <!-- Department Selection -->
    <section class="panel">

      <h2>Select Department</h2>

      <div class="departments">

        <button class="dept">🧵 Sewing</button>
        <button class="dept">✂️ Cutting</button>
        <button class="dept">🎨 Dyeing</button>
        <button class="dept">📦 Packaging</button>

      </div>

    </section>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OH-Master Studio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>OH-Master</h2>
    <p>Studio</p>

    <ul>
      <li>🏠 Dashboard</li>
      <li>🏭 Factory Setup</li>
      <li>📘 Methods</li>
      <li>📊 Reports</li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main">

    <div class="topbar">
      <h1>OH-Master Studio</h1>
      <button>Start Simulation</button>
    </div>

    <!-- KPI Cards -->
    <div class="cards">

      <div class="card">
        <h3>Departments</h3>
        <h2>8</h2>
      </div>

      <div class="card">
        <h3>Methods</h3>
        <h2>5</h2>
      </div>

      <div class="card">
        <h3>Reports</h3>
        <h2>PDF</h2>
      </div>

      <div class="card">
        <h3>Simulator</h3>
        <h2>Ready</h2>
      </div>

    </div>

    <!-- Department Selection -->
    <section class="panel">
      <h2 style="margin-top:30px;">Factory Setup</h2>

<div class="factory-grid">
  <div class="input-box">
  <label>Absorption Method</label>

  <select id="method">
    <option value="unit">Unit Method</option>
    <option value="labour">Labour Hour</option>
    <option value="machine">Machine Hour</option>
    <option value="dlc">Direct Labour Cost %</option>
    <option value="prime">Prime Cost %</option>
  </select>
</div>

<div class="input-box" id="extraBox">
  <label id="extraLabel">Labour Hours</label>
  <input type="number" id="extraInput" value="6000">
</div>

  <div class="input-box">
    <label>Factory Overheads (₹)</label>
    <input type="number" id="oh" value="120000">
  </div>

  <div class="input-box">
    <label>Direct Material (₹)</label>
    <input type="number" id="material" value="800000">
  </div>

  <div class="input-box">
    <label>Direct Labour (₹)</label>
    <input type="number" id="labour" value="600000">
  </div>

  <div class="input-box">
    <label>Units Produced</label>
    <input type="number" id="units" value="6000">
  </div>

</div>

<button class="simulate-btn">Calculate Cost Sheet</button>
      <div class="results">

  <div class="result-card">
    <h4>Material / Unit</h4>
    <h2 id="matPU">₹0</h2>
  </div>

  <div class="result-card">
    <h4>Labour / Unit</h4>
    <h2 id="labPU">₹0</h2>
  </div>

  <div class="result-card">
    <h4>Overhead / Unit</h4>
    <h2 id="ohPU">₹0</h2>
  </div>

  <div class="result-card total">
    <h4>Total Cost</h4>
    <h2 id="totalPU">₹0</h2>
  </div>

</div>

      <h2>Select Department</h2>

      <div class="departments">

        <button class="dept">🧵 Sewing</button>
        <button class="dept">✂️ Cutting</button>
        <button class="dept">🎨 Dyeing</button>
        <button class="dept">📦 Packaging</button>

      </div>

    </section>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
